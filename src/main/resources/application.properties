spring.application.name=transactions-service

# File-backed H2 so data survives restarts (single instance only; no AUTO_SERVER).
spring.datasource.url=jdbc:h2:file:./data/transactions
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Let Spring render errors as RFC 9457 application/problem+json.
spring.mvc.problemdetails.enabled=true